<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metals Element Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
        background-image: url('https://i.pinimg.com/originals/5e/e5/06/5ee5064e4b0e5eb5ee8e464cf9a2efaa.gif');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        }

        .container-box {
            max-width: 600px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #79a8e4;
            font-weight: bold;
        }

        .result-box {
            background: #f1f7f4;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
        }

        .result-box p {
            margin-bottom: 12px;
        }

        .btn-search {
            background: #6c97e1;
            color: white;
        }

        .btn-search:hover {
            background: #4465ac;
            color: white;
        }

        #message {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container-box text-center">

        <h1>NON-METALS</h1>
        <p class="text-muted">
            Non-Metal Element Information Search
        </p>

        <div class="mb-3">
            <input type="text" id="element1"
                class="form-control text-center"
                placeholder="Enter element symbol (e.g. H, O, C)">
        </div>

        <button class="btn btn-search w-100"
            py-click="search_element">
            Search Element
        </button>

        <div class="result-box text-start">

            <h5 class="text-center mb-3">Non-Metal Element Information</h5>

            <p><b>Element Symbol:</b> <span id="symbol">-</span></p>
            <p><b>Element Name:</b> <span id="name">-</span></p>
            <p><b>Atomic Number:</b> <span id="number">-</span></p>
            <p><b>Atomic Mass:</b> <span id="mass">-</span></p>

            <p id="message" class="text-center mb-0"></p>

        </div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
